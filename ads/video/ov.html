<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:LG;src:url(fonts/lg.woff2)}@font-face{font-family:OS;font-weight:500;src:url(fonts/os5.woff2)}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#c{position:absolute;inset:0;overflow:hidden}.full{position:absolute;inset:0}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.blk{position:absolute;left:40px;right:40px;top:985px;transform:translateY(-50%);text-align:center}
.ln{font-family:LG;font-size:200px;line-height:.9;color:#fff;white-space:nowrap;text-shadow:0 4px 26px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5);display:block}
.hi{color:#8BE643}
.os{font-family:OS;font-weight:500;letter-spacing:.12em;color:#fff;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.6)}
</style></head><body><div id="c"></div>
<script>
const LOGO=`__LOGO__`, QR=`__QR__`;
let SEG=[];
async function init(tl){let f=0;for(const s of tl){s.f0=f;s.n=s.b*16;f+=s.n;SEG.push(s)};await document.fonts.load('200px LG');await document.fonts.load('500 40px OS');return f}
const ease=t=>{t=Math.min(Math.max(t,0),1);return 1-Math.pow(1-t,3)};
function fit(el,max){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>max&&fs>40){fs-=4;el.style.fontSize=fs+'px'}}
function lines(s,f,o={}){const blk=document.createElement('div');blk.className='blk';
 s.lines.forEach((t,i)=>{const d=document.createElement('span');d.className='ln'+((s.hi===i)?' hi':'');if(o.color)d.style.color=o.color;if(o.noshadow)d.style.textShadow='none';
  if(o.type){const ch=Math.floor((f-i*14)/1.4);d.textContent=ch<=0?' ':t.slice(0,ch)}
  else{d.textContent=t;const st=i*7,e=ease((f-st)/4);d.style.opacity=f<st?0:Math.min(1,(f-st+1)/3);d.style.transform='scale('+(1.28-0.28*e)+')'}
  blk.appendChild(d)});return blk}
function render(F){const c=document.getElementById('c');c.innerHTML='';const s=SEG.find(x=>F>=x.f0&&F<x.f0+x.n);if(!s||s.src==='hook')return;const f=F-s.f0;
 if(s.clip||s.still){const b=lines(s,f);c.appendChild(b);b.querySelectorAll('.ln').forEach(l=>fit(l,1000));b.style.marginTop=(-f*0.4)+'px';return}
 if(s.kind==='type'){c.innerHTML='<div class="full" style="background:#050505"></div>';const b=lines(s,f,{type:1});c.appendChild(b);b.querySelectorAll('.ln').forEach(l=>fit(l,1000));return}
 if(s.kind==='strobe'){const on=Math.floor(f/8)%2===1,pulse=1+0.06*Math.max(0,1-(f%16)/5);
  c.innerHTML='<div class="full" style="background:'+(on?'#8BE643':'#050505')+'"></div>';const b=lines(s,99,{color:on?'#050505':'#8BE643',noshadow:on});b.style.transform='translateY(-50%) scale('+pulse+')';c.appendChild(b);b.querySelectorAll('.ln').forEach(l=>{l.style.fontSize='300px';fit(l,1000)});return}
 if(s.kind==='logo'){const z=1.04+0.05*f/s.n,e=ease(f/6);
  c.innerHTML='<div class="bgimg" style="background-image:url(src/lounge.jpg);transform:scale('+z+');filter:brightness(.38) saturate(.9)"></div>'+
  '<div style="position:absolute;left:90px;right:90px;top:985px;transform:translateY(-60%) scale('+(1.35-0.35*e)+');opacity:'+Math.min(1,f/3)+'">'+LOGO+'</div>'+
  '<div class="os" style="position:absolute;left:0;right:0;top:1130px;text-align:center;font-size:46px;opacity:'+(f<10?0:Math.min(1,(f-9)/3))+'">PLAY FIRST. PARTY AFTER.</div>';return}
 if(s.kind==='info'){const z=1.02+0.06*f/s.n;
  c.innerHTML='<div class="bgimg" style="background-image:url(src/ext.jpg);transform:scale('+z+');filter:brightness(.5)"></div>';
  const b=lines({lines:['SAT 10 OCT','BUNKER 1965'],hi:1},f);c.appendChild(b);b.querySelectorAll('.ln').forEach(l=>fit(l,1000));
  const sub=document.createElement('div');sub.className='os';sub.style.cssText='position:absolute;left:0;right:0;top:1200px;text-align:center;font-size:40px;line-height:1.5;opacity:'+(f<14?0:Math.min(1,(f-13)/3));sub.innerHTML='RED WAREHOUSE, KUALA LUMPUR<br>4PM TILL MIDNIGHT';c.appendChild(sub);return}
 if(s.kind==='end'){const e=ease(f/5);
  c.innerHTML='<div class="bgimg" style="background-image:url(src/spread.png);filter:blur(28px) brightness(.32);transform:scale(1.1)"></div>'+
  '<div style="position:absolute;left:0;right:0;top:360px;text-align:center"><span class="ln" style="font-size:230px;transform:scale('+(1.2-0.2*e)+')">GET ON THE LIST</span></div>'+
  '<div style="position:absolute;left:350px;top:640px;width:380px;height:380px;background:#fff;border-radius:28px;padding:30px;opacity:'+(f<4?0:1)+'">'+QR+'</div>'+
  '<div class="os" style="position:absolute;left:0;right:0;top:1060px;text-align:center;font-size:54px">THECOOKOUTEVENT.COM</div>'+
  '<div class="os" style="position:absolute;left:0;right:0;top:1150px;text-align:center;font-size:34px;color:#ddd">SAT 10 OCT &nbsp;&middot;&nbsp; BUNKER 1965, RED WAREHOUSE KL</div>'+
  '<div style="position:absolute;left:0;right:0;top:1250px;text-align:center"><span class="ln hi" style="font-size:130px;opacity:'+(f<14?0:1)+'">SAVE US A TENDER.</span></div>';
  c.querySelectorAll('svg').forEach(v=>{v.style.width='100%';v.style.height='100%'});return}
}
</script></body></html>
